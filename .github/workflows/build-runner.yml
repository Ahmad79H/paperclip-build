name: Build Paperclip Runner

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/paperclip-runner/runner

    - name: Build paperclip-runnerd
      run: cargo build --release --manifest-path runner/Cargo.toml --locked -p paperclip-runner-core --bin paperclip-runnerd
      working-directory: packages/paperclip-runner

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: paperclip-runnerd
        path: packages/paperclip-runner/runner/target/release/paperclip-runnerd.exe
        if-no-files-found: error
